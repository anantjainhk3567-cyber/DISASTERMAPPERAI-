version: '3.8'

services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: disastermapper-postgres
    environment:
      POSTGRES_USER: disastermapper
      POSTGRES_PASSWORD: disastermapper_dev
      POSTGRES_DB: disastermapper
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U disastermapper']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - disastermapper-network

  minio:
    image: minio/minio
    container_name: disastermapper-minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - disastermapper-network

  redis:
    image: redis:7-alpine
    container_name: disastermapper-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - disastermapper-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: disastermapper-backend
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://disastermapper:disastermapper_dev@postgres:5432/disastermapper?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-access-secret-change-in-production
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production
      ACCESS_TOKEN_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      AI_SERVICE_URL: http://ai-service:8000
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - disastermapper-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: disastermapper-ai-service
    ports:
      - '8000:8000'
    environment:
      AI_PROVIDER: DEMO
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: info
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request; urllib.request.urlopen(\"http://localhost:8000/ai/health\")" || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - disastermapper-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: disastermapper-frontend
    ports:
      - '5173:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - disastermapper-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  disastermapper-network:
    driver: bridge
